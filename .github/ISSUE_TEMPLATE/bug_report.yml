name: Bug report
description: Report a defect in ScormFlow
labels: [bug, triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload course X
        2. Start an attempt for learner Y
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScormFlow version
      placeholder: "0.0.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: scorm-version
    attributes:
      label: SCORM version of the affected course (if applicable)
      options:
        - "Not applicable"
        - "SCORM 1.2"
        - "SCORM 2004 2nd Edition"
        - "SCORM 2004 3rd Edition"
        - "SCORM 2004 4th Edition"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
