name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            You are reviewing a pull request against the ScormFlow backend (a SCORM 1.2 / 2004 runtime engine).

            Be honest, specific, and concise. Cite files with `path:line` so reviewers can jump straight to the code. If you are uncertain about something, say so explicitly rather than hedging.

            Cover:

            1. **Does it solve the stated problem?** Read the PR title and description, then check whether the diff actually delivers what is promised. Call out gaps.
            2. **Correctness & regressions.** Look for logic bugs, off-by-ones, missing null/undefined handling, broken invariants, and ways the change could break existing behavior.
            3. **API & contract compatibility.** The REST surface under `/api/v1/*` and the Prisma schema are public contracts. Flag any backwards-incompatible change (renamed fields, removed enum variants, changed response shapes, dropped columns, non-additive migrations) and demand a version bump or migration plan.
            4. **SCORM spec compliance.** When CMI fields, runtime API behavior, or `imsmanifest.xml` parsing change, verify against the SCORM 1.2 and 2004 specs. Flag anything that would break spec-compliant courses.
            5. **Security.** Look for: unvalidated input reaching the DB or filesystem, missing tenant scoping on queries, secrets in code, unsafe ZIP extraction (path traversal / zip-slip), permissive CORS, missing auth on routes that need it, raw API keys in logs, SQL injection via raw queries.
            6. **Tests.** Are new behaviors covered? Are tests realistic (no over-mocked DB integration tests)? Do existing tests still make sense?
            7. **Scope discipline.** Flag dead code, speculative abstractions, unrelated refactors, comments that just restate code, and "Phase 2" / "TODO" markers that should be issues instead.

            Format the review as a short summary verdict (one of: APPROVE / REQUEST_CHANGES / COMMENT) followed by grouped findings. Skip sections that have nothing to flag — do not pad.
