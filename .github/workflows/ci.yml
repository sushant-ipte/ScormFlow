name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  schema:
    name: Prisma schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scormflow
          POSTGRES_PASSWORD: scormflow
          POSTGRES_DB: scormflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scormflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scormflow:scormflow@localhost:5432/scormflow?schema=public
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Validate schema
        run: npx prisma validate

      - name: Verify migrations apply cleanly
        run: npx prisma migrate deploy

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scormflow
          POSTGRES_PASSWORD: scormflow
          POSTGRES_DB: scormflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scormflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://scormflow:scormflow@localhost:5432/scormflow?schema=public
      JWT_SECRET: ci-jwt-secret-thirty-two-characters-long
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Run tests
        run: npm test
